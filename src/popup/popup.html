<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS Dashboard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🛡️ AEGIS v6.0</h1>
      <p class="subtitle">Enterprise Privacy Shield</p>
    </header>

    <section class="stats-section">
      <h2>Protection Stats</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-number" id="totalProtected">0</span>
          <span class="stat-label">Items Protected</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="todayProtected">0</span>
          <span class="stat-label">Today</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="sitesVisited">0</span>
          <span class="stat-label">Sites Visited</span>
        </div>
      </div>
    </section>

    <section class="settings-section">
      <h2>Quick Settings</h2>
      <div class="setting-item">
        <label for="themeToggle">Dark Mode</label>
        <input type="checkbox" id="themeToggle">
      </div>
      <div class="setting-item">
        <label for="ollamaToggle">Ollama AI Detection</label>
        <input type="checkbox" id="ollamaToggle">
      </div>
      <div class="setting-item">
        <label for="sensitivity">Sensitivity Level</label>
        <select id="sensitivity">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </section>

    <section class="actions-section">
      <button id="clearStats" class="btn btn-secondary">Clear Stats</button>
      <button id="exportLogs" class="btn btn-primary">Export Audit Logs</button>
    </section>

    <footer>
      <p>🌐 Universal AI Privacy Shield</p>
      <p class="version">Build: Enterprise v6.0</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
