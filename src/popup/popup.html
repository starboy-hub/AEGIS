<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AEGIS Data Cloak</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --header-bg: #6200ea;
      --header-text: #ffffff;
      --card-bg: #f5f5f5;
      --toggle-bg: #cccccc;
      --toggle-active: #6200ea;
      --danger: #d32f2f;
      --success: #388e3c;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --text-color: #e0e0e0;
        --border-color: #333333;
        --header-bg: #4500b5;
        --card-bg: #1e1e1e;
        --toggle-bg: #555555;
      }
    }

    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }

    .content {
      padding: 15px;
    }

    .stat-box {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .stat-number {
      font-size: 24px;
      font-weight: bold;
      color: var(--header-bg);
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .toggle-switch {
      position: relative;
      width: 50px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--toggle-bg);
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--toggle-active);
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--header-bg);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    .status {
      font-size: 12px;
      text-align: center;
      margin-top: 10px;
      color: var(--success);
    }
  </style>
</head>
<body>
  <header>🛡️ AEGIS Data Cloak</header>
  <div class="content">
    <div class="stat-box">
      <div>Threats Blocked</div>
      <div class="stat-number" id="blockCount">0</div>
    </div>

    <div class="setting-row">
      <span>Enable Protection</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enabledToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-row">
      <span>Regex Detection</span>
      <label class="toggle-switch">
        <input type="checkbox" id="regexToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-row">
      <span>AI Analysis</span>
      <label class="toggle-switch">
        <input type="checkbox" id="aiToggle">
        <span class="slider"></span>
      </label>
    </div>

    <button id="optionsBtn">⚙️ Advanced Settings</button>
    <div class="status" id="statusMsg"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
