name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dist is complete
        run: node -e "
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
          const refs = [m.background.service_worker, m.content_scripts[0].js, m.action.default_popup, m.options_page, ...Object.values(m.action.default_icon || {}), ...Object.values(m.icons || {})].flat();
          const missing = refs.filter(f => !fs.existsSync('dist/' + f));
          if (missing.length) { console.error('MISSING:', missing); process.exit(1); }
          console.log('dist complete, version', m.version);
        "
